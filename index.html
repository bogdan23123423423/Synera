:root{--bg:#f5f6f7;--card:#fff;--tx:#14171f;--sub:#6b7280;--line:#e4e7ec;--pill:#eceff3;--g1:#2a3fe3;--g2:#5fb0ea;--g3:#7be6d5;--grad:linear-gradient(135deg,var(--g1),var(--g2) 58%,var(--g3));--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:light}
[data-theme=dark]{--bg:#0e1014;--card:#1a1d24;--tx:#f2f4f8;--sub:#9aa3b2;--line:#2a2e37;--pill:#1d2027;--g1:#4b63ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.35 "Manrope",sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
input,select{font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;display:grid;place-items:center}
svg{flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{position:relative;padding:calc(var(--sat) + 8px) 12px 8px;background:var(--bg)}
#addr{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 14px;border-radius:16px;background:var(--pill)}
#addr:focus-within{background:var(--card);box-shadow:0 0 0 2px var(--g2)}
#ico{display:grid;color:var(--sub)}
#url{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:inherit;font-size:16px}
#addr button{width:36px;height:36px;border-radius:12px;color:var(--sub)}
#prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--grad);opacity:0}
#view{flex:1;position:relative;min-height:0}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#frames iframe.on{display:block}
.pg{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column;align-items:center;padding:24px 16px}
.pg.on{display:flex}
#home{gap:22px;padding-top:7vh}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px}
.logo b{font-size:48px;font-weight:700;line-height:1.15;letter-spacing:-1.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{width:100%;max-width:560px;height:52px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--sub);font-size:16px;box-shadow:0 2px 12px rgba(42,63,227,.08);text-align:left}
#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;width:100%;max-width:560px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub);min-width:0}
.tile i,.av,.tc i,.bi{display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
.tile i{width:56px;height:56px;border-radius:18px;font-size:22px}
.ti{width:56px;height:56px;display:block}
.ti,img.av{object-fit:contain}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#blk{justify-content:center;text-align:center;gap:12px}
#blk .bi{width:72px;height:72px;border-radius:24px;font-size:30px}
#blk b{font-size:18px}#blk p{max-width:320px}
#sug{position:absolute;inset:0;z-index:5;background:var(--bg);overflow:auto;padding:4px 12px;display:none}
#sug.on{display:block}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row b{display:block}
.row small{color:var(--sub);font-size:12px}
.av{width:40px;height:40px;border-radius:14px;flex:none}
#bar{display:flex;justify-content:space-around;align-items:center;height:calc(58px + var(--sab));padding:0 6px var(--sab);background:var(--bg);border-top:1px solid var(--line)}
#bar button{width:52px;height:46px;border-radius:14px}
#bar button:active{background:var(--pill)}
#bar button:disabled{opacity:.3}
#bar #mic{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(42,63,227,.35)}
#mic.rec{animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.14)}}
.cnt{width:24px;height:24px;border:2px solid currentColor;border-radius:8px;font:700 12px/1 inherit;display:grid;place-items:center}
#sh{position:fixed;inset:0;z-index:20;display:none}
#sh.on{display:block}
#sh .bg{position:absolute;inset:0;background:rgba(10,14,25,.45);animation:fi .2s}
#sh .box{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + var(--sab));max-height:88%;overflow:auto;animation:up .25s ease}
#sh .box.full{height:92%;display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fi{from{opacity:0}}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.hd button{width:40px;height:40px;border-radius:12px;background:var(--pill)}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mg button{padding:10px 2px;gap:6px;font-size:12px;border-radius:16px;text-align:center}
.mg .c{width:50px;height:50px;border-radius:17px;background:var(--pill);display:grid;place-items:center}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:6px 0 14px;flex:1;overflow:auto;align-content:start}
.tc{position:relative;min-height:120px;border-radius:18px;background:var(--pill);padding:12px;display:flex;flex-direction:column;justify-content:flex-end;border:2px solid transparent;cursor:pointer}
.tc.on{border-color:var(--g2)}
.tc i{position:absolute;left:12px;top:12px;width:36px;height:36px;border-radius:12px}
.tc b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:32px;height:32px;border-radius:10px;color:var(--sub);flex:none}
.tc .x{position:absolute;right:8px;top:8px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:320px;height:50px;border-radius:16px;background:var(--grad);color:#fff;font-weight:600;font-size:16px}
.ghost{height:44px;color:var(--g1);font-weight:600}
.sub{color:var(--sub);font-size:13px;margin-top:10px}
label{display:block;margin-top:14px;font-size:13px;color:var(--sub)}
.fld{display:block;width:100%;height:44px;margin-top:6px;border-radius:12px;border:1px solid var(--line);background:var(--pill);color:var(--tx);padding:0 12px;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translateX(-50%);background:#14171f;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;z-index:30;text-align:center}
#toast.on{opacity:1}
@media(min-width:820px){#bar{width:min(520px,100%);margin:0 auto 12px;height:60px;padding:0 6px;border:1px solid var(--line);border-radius:22px;background:var(--card)}#top{max-width:760px;width:100%;margin:0 auto}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="addr"><span id="ico"></span><input id="url" type="text" inputmode="url" enterkeyhint="go" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Поиск или адрес"><button id="rl" aria-label="Обновить"></button></div>
    <div id="prog"></div>

  </nav>
</div>

tint=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%60;h+=170;return`background:linear-gradient(135deg,hsl(${h+25} 80% 52%),hsl(${h} 75% 62%))`},
toast=(m,ms=2200)=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms)},
norm=v=>{v=v.trim();if(!v)return'';if(/^[a-z][a-z0-9+.-]*:\/\//i.test(v))return v.replace(/^http:/i,'https:');if(/^(localhost|([\w-]+\.)+[\w-]{2,})(:\d+)?([\/?#]\S*)?$/i.test(v))return'https://'+v;return SE[S.se]+encodeURIComponent(v)};

function theme(){let t=S.theme;if(t=='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;$('meta[name=theme-color]').content=t=='dark'?'#0e1014':'#f5f6f7'}
function prog(){const p=$('#prog');p.style.transition='none';p.style.width='0';p.style.opacity=1;requestAnimationFrame(()=>requestAnimationFrame(()=>{p.style.transition='width 6s cubic-bezier(.1,.7,.2,1)';p.style.width='85%'}))}
function done(){const p=$('#prog');p.style.transition='width .25s,opacity .4s .25s';p.style.width='100%';p.style.opacity=0}

function newTab(u){const t={h:[],i:-1,title:'Новая вкладка',fr:null,blocked:false};tabs.push(t);cur=t;u?go(u):(render(),done())}
function closeTab(t){const k=tabs.indexOf(t);if(t.fr)t.fr.remove();tabs.splice(k,1);if(!tabs.length)return newTab();if(cur===t){cur=tabs[Math.min(k,tabs.length-1)];render()}else render()}
function go(v){const u=norm(v);if(!u)return;const t=cur;t.h=t.h.slice(0,t.i+1);t.h.push(u);t.i=t.h.length-1;load(t)}
function load(t){
  const u=t.h[t.i],px=S.proxy.includes('{url}');
  t.title=host(u);t.blocked=!px&&BLK.test(t.title);
  if(!t.blocked){
    if(!t.fr){t.fr=E('iframe');t.fr.allow='fullscreen; clipboard-write; geolocation; autoplay';$('#frames').append(t.fr)}
    prog();t.fr.src=px?S.proxy.replace('{url}',encodeURIComponent(u)):u;
    t.fr.onload=()=>{if(t===cur)done();if(!hinted){hinted=1;toast('Страница пустая? Меню → «Открыть снаружи»',5000)}};
  }else done();
  render();
}
function back(){const t=cur;if(t.i<0)return;t.i--;if(t.i<0){done();render()}else load(t)}
function fwd(){const t=cur;if(t.i<t.h.length-1){t.i++;load(t)}}
function reload(){if(cur.i>=0)load(cur)}
function ext(){const u=cur.h[cur.i];if(!u)return toast('Сначала откройте страницу');open(u,'_blank','noopener')}
function share(){const u=cur.h[cur.i];if(!u)return toast('Сначала откройте страницу');if(navigator.share)navigator.share({url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);toast('Ссылка скопирована')}catch(e){toast(u)}}}
function addBm(){const u=cur.h[cur.i];if(!u)return toast('Сначала откройте страницу');if(!BM.some(b=>b[1]==u)){BM.push([host(u),u]);SV('bm',BM);tiles()}toast('Добавлено в закладки')}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Голосовой поиск не поддерживается этим устройством');const r=new R();r.lang='ru-RU';r.onresult=e=>go(e.results[0][0].transcript);r.onerror=()=>toast('Не удалось распознать речь');r.onstart=()=>$('#mic').classList.add('rec');r.onend=()=>$('#mic').classList.remove('rec');try{r.start()}catch(e){}}

function render(){
  const t=cur,u=t.h[t.i]||'',home=t.i<0,inp=$('#url');
  $('#home').classList.toggle('on',home);
  $('#blk').classList.toggle('on',!home&&t.blocked);
  tabs.forEach(x=>x.fr&&x.fr.classList.toggle('on',x===t&&!home&&!t.blocked));
  if(document.activeElement!==inp)inp.value=home?'':pretty(u);
  inp.dataset.full=u;
  $('#ico').innerHTML=home?ic('search',20):ic('lock',17);
  $('#rl').style.visibility=home?'hidden':'visible';
  $('#bk').disabled=home;$('#fw').disabled=t.i>=t.h.length-1;
  $('#cnt').textContent=tabs.length;
  if(!home&&t.blocked){const h=host(u);$('#blk').innerHTML=`<i class="bi" style="${tint(h)}">${esc(h[0].toUpperCase())}</i><b>${esc(h)}</b><p class="sub">Этот сайт запрещает показ внутри других страниц. Откройте его отдельно или подключите прокси в настройках.</p><button class="cta" onclick="ext()">${ic('ext')} Открыть сайт</button><button class="ghost" onclick="setUI()">Подключить прокси</button>`}
}
function tiles(){const g=$('#tiles');g.innerHTML='';BM.forEach(([n,u])=>{const t=E('div','tile',(host(u)==='ya.ru'?`<img class="ti" src="${YA}" alt="">`:`<i style="${tint(n)}">${esc(n[0].toUpperCase())}</i>`)+`<span>${esc(n)}</span>`);t.onclick=()=>go(u);g.append(t)})}

function sug(){
  const q=$('#url').value.trim(),b=$('#sug'),l=[];
  if(q)l.push(['search',/\s/.test(q)||!/\./.test(q)?`Искать «${esc(q)}»`:`Открыть ${esc(q)}`,q]);
  BM.filter(([n,u])=>!q||(n+u).toLowerCase().includes(q.toLowerCase())).slice(0,6).forEach(([n,u])=>l.push(['star',`${esc(n)} <small>${esc(host(u))}</small>`,u]));
  b.innerHTML='';
  l.forEach(([i,h,v])=>{const r=E('div','row',ic(i,20)+`<div class="t">${h}</div>`);r.onpointerdown=e=>{e.preventDefault();$('#url').blur();go(v)};b.append(r)});
}

const sheet=c=>{$('#sh').classList.add('on');const b=$('#sh .box');b.className='box '+(c||'');b.innerHTML='';return b},
closeSh=()=>$('#sh').classList.remove('on'),
head=t=>`<div class="hd"><b>${t}</b><button onclick="closeSh()" aria-label="Закрыть">${ic('close')}</button></div>`;

function menu(){
  const b=sheet(),it=[['plus','Новая вкладка',()=>newTab()],['book','Закладки',bms],['star','В закладки',addBm],['share','Поделиться',share],['ext','Открыть снаружи',ext],['reload','Обновить',reload],['home','Главная',()=>{cur.i=-1;done();render()}],['set','Настройки',setUI]];
  b.innerHTML='<div class="mg"></div>';
  it.forEach(([i,n,f])=>{const x=E('button','',`<span class="c">${ic(i)}</span>${n}`);x.onclick=()=>{closeSh();f()};b.firstChild.append(x)});
}
function tabsUI(){
  const b=sheet('full');
  b.innerHTML=head('Вкладки: '+tabs.length)+'<div class="tg"></div>'+`<button class="cta" style="max-width:none" onclick="closeSh();newTab()">${ic('plus')} Новая вкладка</button>`;
  const g=b.querySelector('.tg');
  tabs.forEach(t=>{
    const c=E('div','tc'+(t===cur?' on':''),`<button class="x" aria-label="Закрыть вкладку">${ic('close',18)}</button><i style="${tint(t.title)}">${esc(t.title[0].toUpperCase())}</i><b>${esc(t.i<0?'Новая вкладка':t.title)}</b>`);
    c.onclick=()=>{cur=t;render();closeSh()};
    c.querySelector('.x').onclick=e=>{e.stopPropagation();closeTab(t);tabsUI()};
    g.append(c);
  });
}
function bms(){
  const b=sheet();b.innerHTML=head('Закладки');
  if(!BM.length)b.append(E('p','sub','Закладок пока нет. Откройте сайт и выберите «В закладки» в меню.'));
  BM.forEach(([n,u],k)=>{
    const r=E('div','row',`${host(u)==='ya.ru'?`<img class="av" src="${YA}" alt="">`:`<i class="av" style="${tint(n)}">${esc(n[0].toUpperCase())}</i>`}<div class="t"><b>${esc(n)}</b><small>${esc(u)}</small></div><button class="x" aria-label="Удалить">${ic('close',18)}</button>`);
    r.querySelector('.t').onclick=()=>{closeSh();go(u)};
    r.querySelector('.x').onclick=()=>{BM.splice(k,1);SV('bm',BM);tiles();bms()};
    b.append(r);
  });
}
function setUI(){
  const b=sheet(),o=(a,v)=>a.map(([k,n])=>`<option value="${k}"${v==k?' selected':''}>${n}</option>`).join('');
  b.innerHTML=head('Настройки')+`<label>Поисковая система<select id="sse" class="fld">${o([['yandex','Яндекс'],['google','Google'],['ddg','DuckDuckGo'],['bing','Bing']],S.se)}</select></label><label>Тема<select id="sth" class="fld">${o([['auto','Как в системе'],['light','Светлая'],['dark','Тёмная']],S.theme)}</select></label><label>Прокси-шаблон (необязательно)<input id="spx" class="fld" autocapitalize="off" autocorrect="off" placeholder="https://proxy.example/?url={url}" value="${esc(S.proxy)}"></label><p class="sub">Через прокси открываются сайты, которые запрещают показ внутри других страниц. Адрес сайта подставляется вместо {url}.</p>`;
  b.querySelectorAll('select,input').forEach(e=>e.onchange=()=>{S.se=$('#sse').value;S.theme=$('#sth').value;S.proxy=$('#spx').value.trim();SV('s',S);theme()});
}

$('#bk').innerHTML=ic('back',24);$('#fw').innerHTML=ic('fwd',24);$('#mic').innerHTML=ic('mic',24);$('#mn').innerHTML=ic('dots',24);$('#rl').innerHTML=ic('reload',20);$('#bigs').innerHTML=ic('search',20)+'<span>Поиск или адрес</span>';
$('#bk').onclick=back;$('#fw').onclick=fwd;$('#mic').onclick=voice;$('#tb').onclick=tabsUI;$('#mn').onclick=menu;$('#rl').onclick=reload;
$('#bigs').onclick=()=>$('#url').focus();
const U=$('#url');
U.onfocus=()=>{U.value=U.dataset.full||'';setTimeout(()=>U.select(),0);$('#sug').classList.add('on');sug()};
U.oninput=sug;
U.onblur=()=>{$('#sug').classList.remove('on');render()};
U.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go(U.value);U.blur()}};
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',theme);
theme();tiles();newTab();
</script>
</body>
</html>
